name: test

on:
  workflow_run:
    workflows: 
      - verify
    types: 
      - completed
    branches: 
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      DOTFILES_PROFILE: github
      DOTFILES_PLATFORM: ci
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get install -y jq gettext-base
      - name: Run tests
        run: make test
