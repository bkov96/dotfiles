name: verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DOTFILES_PROFILE: github
      DOTFILES_PLATFORM: ci
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get install -y shellcheck shfmt
      - name: Run verify
        run: make verify
